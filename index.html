<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAV Audio Editor</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
        }

        h1 {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 20px;
            color: var(--text);
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
        }

        .file-input-wrapper {
            position: relative;
            display: block;
            width: 100%;
            padding: 16px;
            background-color: rgba(255, 255, 255, 0.05);
            border: 2px dashed var(--border);
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 16px;
        }

        .file-input-wrapper input {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .btn {
            display: inline-block;
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: background-color 0.2s;
        }

        .btn:disabled {
            background-color: var(--border);
            cursor: not-allowed;
            opacity: 0.6;
        }

        .file-list {
            list-style: none;
            margin-bottom: 16px;
        }

        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            border: 1px solid var(--border);
        }

        .file-name {
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 60%;
        }

        .file-controls {
            display: flex;
            gap: 6px;
        }

        .btn-mini {
            background: var(--border);
            color: var(--text);
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .range-container {
            margin: 16px 0;
        }

        .range-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--primary);
        }

        audio {
            width: 100%;
            margin-top: 12px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <h1>WAV Audio Editor</h1>

    <div class="card">
        <label class="file-input-wrapper">
            <span>ファイルを選択 (複数可)</span>
            <input type="file" id="audioFiles" accept="audio/wav,audio/x-wav" multiple>
        </label>
        <ul id="fileList" class="file-list"></ul>
    </div>

    <div class="card" id="trimSection" style="display: none;">
        <h2 style="font-size: 1.1rem; margin-bottom: 12px;">トリミング設定</h2>
        
        <div class="range-container">
            <div class="range-label">
                <span>開始位置</span>
                <span id="startTimeLabel">0.00 秒</span>
            </div>
            <input type="range" id="startRange" min="0" value="0" step="0.01">
        </div>

        <div class="range-container">
            <div class="range-label">
                <span>終了位置</span>
                <span id="endTimeLabel">0.00 秒</span>
            </div>
            <input type="range" id="endRange" min="0" value="0" step="0.01">
        </div>
    </div>

    <div class="card">
        <button id="processBtn" class="btn" disabled>書き出す (トリミング・結合)</button>
        <div id="outputContainer" style="margin-top: 16px; display: none;">
            <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 8px;">プレビュー / ダウンロード:</p>
            <audio id="audioPreview" controls></audio>
            <a id="downloadBtn" class="btn" style="margin-top: 12px; text-decoration: none; background-color: #10b981;">ファイルをダウンロード</a>
        </div>
    </div>

    <script>
        const audioFileInput = document.getElementById('audioFiles');
        const fileListEl = document.getElementById('fileList');
        const trimSection = document.getElementById('trimSection');
        const startRange = document.getElementById('startRange');
        const endRange = document.getElementById('endRange');
        const startTimeLabel = document.getElementById('startTimeLabel');
        const endTimeLabel = document.getElementById('endTimeLabel');
        const processBtn = document.getElementById('processBtn');
        const outputContainer = document.getElementById('outputContainer');
        const audioPreview = document.getElementById('audioPreview');
        const downloadBtn = document.getElementById('downloadBtn');

        let audioFiles = [];
        let totalDuration = 0;
        let audioContext = new (window.AudioContext || window.webkitAudioContext)();

        audioFileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                if (file.type.includes('wav') || file.name.endsWith('.wav')) {
                    audioFiles.push(file);
                }
            });
            audioFileInput.value = '';
            updateFileList();
        });

        function updateFileList() {
            fileListEl.innerHTML = '';
            audioFiles.forEach((file, index) => {
                const li = document.createElement('li');
                li.className = 'file-item';
                li.innerHTML = `
                    <span class="file-name">${index + 1}. ${file.name}</span>
                    <div class="file-controls">
                        <button class="btn-mini" onclick="moveFile(${index}, -1)" ${index === 0 ? 'disabled' : ''}>▲</button>
                        <button class="btn-mini" onclick="moveFile(${index}, 1)" ${index === audioFiles.length - 1 ? 'disabled' : ''}>▼</button>
                        <button class="btn-mini btn-danger" onclick="removeFile(${index})">✕</button>
                    </div>
                `;
                fileListEl.appendChild(li);
            });

            if (audioFiles.length > 0) {
                calculateTotalDuration();
            } else {
                trimSection.style.display = 'none';
                processBtn.disabled = true;
            }
        }

        window.moveFile = function(index, direction) {
            const targetIndex = index + direction;
            if (targetIndex >= 0 && targetIndex < audioFiles.length) {
                const temp = audioFiles[index];
                audioFiles[index] = audioFiles[targetIndex];
                audioFiles[targetIndex] = temp;
                updateFileList();
            }
        };

        window.removeFile = function(index) {
            audioFiles.splice(index, 1);
            updateFileList();
        };

        async function calculateTotalDuration() {
            totalDuration = 0;
            for (let file of audioFiles) {
                const arrayBuffer = await file.arrayBuffer();
                const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                totalDuration += audioBuffer.duration;
            }

            startRange.max = totalDuration;
            endRange.max = totalDuration;
            startRange.value = 0;
            endRange.value = totalDuration;

            updateRangeLabels();
            trimSection.style.display = 'block';
            processBtn.disabled = false;
        }

        function updateRangeLabels() {
            let start = parseFloat(startRange.value);
            let end = parseFloat(endRange.value);

            if (start >= end) {
                start = end - 0.01;
                startRange.value = Math.max(0, start);
            }

            startTimeLabel.textContent = `${parseFloat(startRange.value).toFixed(2)} 秒`;
            endTimeLabel.textContent = `${parseFloat(endRange.value).toFixed(2)} 秒`;
        }

        startRange.addEventListener('input', updateRangeLabels);
        endRange.addEventListener('input', updateRangeLabels);

        processBtn.addEventListener('click', async () => {
            processBtn.disabled = true;
            processBtn.textContent = '処理中...';

            try {
                const buffers = [];
                for (let file of audioFiles) {
                    const arrayBuffer = await file.arrayBuffer();
                    const decodedData = await audioContext.decodeAudioData(arrayBuffer);
                    buffers.push(decodedData);
                }

                // トラックを1つのバッファに結合
                const sampleRate = buffers[0].sampleRate;
                const numberOfChannels = buffers[0].numberOfChannels;
                const totalSamples = buffers.reduce((acc, buf) => acc + buf.length, 0);

                const mergedBuffer = audioContext.createBuffer(numberOfChannels, totalSamples, sampleRate);

                for (let channel = 0; channel < numberOfChannels; channel++) {
                    const outputData = mergedBuffer.getChannelData(channel);
                    let offset = 0;
                    for (let buf of buffers) {
                        const channelData = buf.numberOfChannels > channel ? buf.getChannelData(channel) : buf.getChannelData(0);
                        outputData.set(channelData, offset);
                        offset += buf.length;
                    }
                }

                // トリミング適用
                const startTime = parseFloat(startRange.value);
                const endTime = parseFloat(endRange.value);
                const startSample = Math.floor(startTime * sampleRate);
                const endSample = Math.floor(endTime * sampleRate);
                const trimmedLength = endSample - startSample;

                const trimmedBuffer = audioContext.createBuffer(numberOfChannels, trimmedLength, sampleRate);

                for (let channel = 0; channel < numberOfChannels; channel++) {
                    const inputData = mergedBuffer.getChannelData(channel);
                    const outputData = trimmedBuffer.getChannelData(channel);
                    for (let i = 0; i < trimmedLength; i++) {
                        outputData[i] = inputData[startSample + i];
                    }
                }

                // WAVファイルエンコード
                const wavBlob = audioBufferToWav(trimmedBuffer);
                const url = URL.createObjectURL(wavBlob);

                audioPreview.src = url;
                downloadBtn.href = url;
                downloadBtn.download = `edited_${Date.now()}.wav`;
                outputContainer.style.display = 'block';

            } catch (err) {
                alert('処理中にエラーが発生しました。');
                console.error(err);
            } finally {
                processBtn.disabled = false;
                processBtn.textContent = '書き出す (トリミング・結合)';
            }
        });

        // AudioBufferをWAV Blobに変換する関数
        function audioBufferToWav(buffer) {
            const numChannels = buffer.numberOfChannels;
            const sampleRate = buffer.sampleRate;
            const format = 1; // PCM
            const bitDepth = 16;
            
            const bytesPerSample = bitDepth / 8;
            const blockAlign = numChannels * bytesPerSample;
            
            const dataLength = buffer.length * blockAlign;
            const bufferLength = 44 + dataLength;
            
            const arrayBuffer = new ArrayBuffer(bufferLength);
            const view = new DataView(arrayBuffer);
            
            /* RIFF identifier */
            writeString(view, 0, 'RIFF');
            /* RIFF chunk length */
            view.setUint32(4, 36 + dataLength, true);
            /* RIFF type */
            writeString(view, 8, 'WAVE');
            /* format chunk identifier */
            writeString(view, 12, 'fmt ');
            /* format chunk length */
            view.setUint32(16, 16, true);
            /* sample format */
            view.setUint16(20, format, true);
            /* channel count */
            view.setUint16(22, numChannels, true);
            /* sample rate */
            view.setUint32(24, sampleRate, true);
            /* byte rate (sample rate * block align) */
            view.setUint32(28, sampleRate * blockAlign, true);
            /* block align */
            view.setUint16(32, blockAlign, true);
            /* bits per sample */
            view.setUint16(34, bitDepth, true);
            /* data chunk identifier */
            writeString(view, 36, 'data');
            /* data chunk length */
            view.setUint32(40, dataLength, true);
            
            // 16-bit PCMデータ書き込み
            const channels = [];
            for (let i = 0; i < numChannels; i++) {
                channels.push(buffer.getChannelData(i));
            }
            
            let offset = 44;
            for (let i = 0; i < buffer.length; i++) {
                for (let channel = 0; channel < numChannels; channel++) {
                    let sample = channels[channel][i];
                    sample = Math.max(-1, Math.min(1, sample));
                    sample = (sample < 0 ? sample * 0x8000 : sample * 0x7FFF) | 0;
                    view.setInt16(offset, sample, true);
                    offset += 2;
                }
            }
            
            return new Blob([arrayBuffer], { type: 'audio/wav' });
        }

        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }
    </script>
</body>
</html>
