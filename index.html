<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Icon & Banner Studio - GAME PORTAL</title>
    <!-- html2canvasライブラリ（Canvasキャプチャ・画像ダウンロード用） -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #0a0a0f;
            --neon-blue: #00f0ff;
            --neon-pink: #ff007f;
            --neon-purple: #bd00ff;
            --text-main: #ffffff;
            --text-sub: #8a8a9e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
            background-color: #050508;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: row;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        /* 左側：プレビュー作業領域 */
        .stage-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #000;
            position: relative;
            overflow: auto;
            padding: 40px;
        }

        /* プレビューキャンバス Wrapper */
        .canvas-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            max-width: 100%;
            max-height: 100%;
        }

        /* プレビューキャンバス */
        .icon-canvas {
            width: 512px;
            height: 512px;
            background-color: var(--bg-color);
            /* グラデーションの中心を「50% 50%（真ん中）」に変更 */
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 240, 255, 0.25) 0%, transparent 65%),
                radial-gradient(circle at 50% 50%, rgba(255, 0, 127, 0.2) 0%, transparent 80%);
            border-radius: 0px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            transition: width 0.3s ease, height 0.3s ease, border-radius 0.2s ease;
            overflow: hidden;
            flex-shrink: 0;
        }

        /* タイトル・サブタイトルのスタイル */
        .title-logo {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
            line-height: 1.2;
            transform: translateY(0px);
            white-space: nowrap;
            /* 字間オフセット相殺用 */
            margin-right: -2px;
        }

        .title-sub {
            font-size: 16px;
            color: var(--text-sub);
            letter-spacing: 6px;
            margin-top: 12px;
            transform: translateY(0px);
            white-space: nowrap;
            margin-right: -6px;
        }

        /* ガイドライン */
        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: none;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 10% 10%;
            border: 1px solid rgba(0, 240, 255, 0.3);
            z-index: 5;
        }

        .grid-overlay::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 1px;
            background: rgba(0, 240, 255, 0.4);
        }

        .grid-overlay::after {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            width: 1px;
            height: 100%;
            background: rgba(0, 240, 255, 0.4);
        }

        /* 右側：コントローラーパネル */
        .control-panel {
            width: 380px;
            background: rgba(15, 15, 25, 0.95);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
            z-index: 10;
        }

        .panel-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--neon-blue);
            letter-spacing: 1px;
            margin-bottom: 4px;
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
            padding-bottom: 8px;
        }

        .control-group {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 12px 14px;
        }

        .control-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        .control-label span.val {
            color: var(--neon-pink);
            font-family: monospace;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--neon-blue);
            cursor: pointer;
        }

        input[type="text"] {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 8px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--neon-blue);
        }

        .toggle-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
        }

        .toggle-btn:hover {
            background: rgba(0, 240, 255, 0.2);
            border-color: var(--neon-blue);
        }

        .toggle-btn.active {
            background: var(--neon-blue);
            color: #000;
        }

        .mode-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 4px;
        }

        .mode-btn {
            flex: 1;
            padding: 8px 4px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-sub);
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }

        .mode-btn.active {
            background: rgba(0, 240, 255, 0.15);
            border-color: var(--neon-blue);
            color: var(--neon-blue);
        }

        .preset-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .preset-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 6px 4px;
            font-size: 11px;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
        }

        .preset-btn:hover {
            border-color: var(--neon-pink);
            color: var(--neon-pink);
        }

        .download-btn {
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple));
            border: none;
            color: #fff;
            padding: 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0, 240, 255, 0.3);
            transition: all 0.2s;
        }

        .download-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0, 240, 255, 0.5);
        }

        @media (max-width: 900px) {
            body {
                flex-direction: column;
                overflow: auto;
            }
            .stage-area {
                min-height: 500px;
                padding: 20px;
            }
            .control-panel {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- 左側：撮影・作成ステージ -->
    <div class="stage-area">
        <div class="canvas-wrapper">
            <div id="icon-canvas" class="icon-canvas">
                <div id="grid-overlay" class="grid-overlay"></div>
                <div id="title-logo" class="title-logo">Game Portal</div>
                <div id="title-sub" class="title-sub">NEXT GENERATION</div>
            </div>
        </div>
    </div>

    <!-- 右側：設定パネル -->
    <div class="control-panel">
        <div class="panel-title">STUDIO CONTROLS</div>

        <!-- ダウンロード実行ボタン -->
        <button class="download-btn" onclick="downloadImage()">PNG画像として保存</button>

        <!-- モード選択 -->
        <div class="control-group">
            <div class="control-label">用途・アスペクト比選択</div>
            <div class="mode-selector">
                <button id="mode-icon" class="mode-btn active" onclick="switchMode('icon')">正方形 (1:1)</button>
                <button id="mode-video" class="mode-btn" onclick="switchMode('video')">横動画 (16:9)</button>
                <button id="mode-banner" class="mode-btn" onclick="switchMode('banner')">バナー / ヘッダー</button>
            </div>
        </div>

        <!-- サイズコントロール -->
        <div class="control-group">
            <div class="control-label">プリセットサイズ</div>
            <!-- アイコン用 -->
            <div id="presets-icon" class="preset-grid">
                <button class="preset-btn" onclick="setCanvasSize(512, 512)">512×512 (Square)</button>
                <button class="preset-btn" onclick="setCanvasSize(1024, 1024)">1024×1024 (HD Square)</button>
                <button class="preset-btn" onclick="setCanvasSize(256, 256)">256×256 (Small)</button>
                <button class="preset-btn" onclick="setCanvasSize(180, 180)">180×180 (App Icon)</button>
            </div>
            <!-- 横動画用 (16:9) -->
            <div id="presets-video" class="preset-grid" style="display: none;">
                <button class="preset-btn" onclick="setCanvasSize(1920, 1080)">1920×1080 (FHD Video)</button>
                <button class="preset-btn" onclick="setCanvasSize(1280, 720)">1280×720 (HD Video)</button>
                <button class="preset-btn" onclick="setCanvasSize(854, 480)">854×480 (SD Video)</button>
                <button class="preset-btn" onclick="setCanvasSize(640, 360)">640×360 (360p Video)</button>
            </div>
            <!-- バナー/ヘッダー用 -->
            <div id="presets-banner" class="preset-grid" style="display: none;">
                <button class="preset-btn" onclick="setCanvasSize(1200, 630)">1200×630 (OGP/SNS)</button>
                <button class="preset-btn" onclick="setCanvasSize(800, 400)">800×400 (Card)</button>
                <button class="preset-btn" onclick="setCanvasSize(800, 250)">800×250 (Header)</button>
                <button class="preset-btn" onclick="setCanvasSize(600, 200)">600×200 (Banner)</button>
            </div>

            <div class="control-label" style="margin-top: 12px;">カスタム幅 (W) <span id="val-width" class="val">512px</span></div>
            <input type="range" id="range-width" min="100" max="2500" step="10" value="512" oninput="manualSizeChange()">

            <div class="control-label" style="margin-top: 8px;">カスタム高さ (H) <span id="val-height" class="val">512px</span></div>
            <input type="range" id="range-height" min="100" max="2500" step="10" value="512" oninput="manualSizeChange()">
        </div>

        <!-- テキスト変更 -->
        <div class="control-group">
            <div class="control-label">メインタイトル</div>
            <input type="text" id="input-title" value="Game Portal" oninput="updateText()">
            <div class="control-label" style="margin-top: 8px;">サブタイトル</div>
            <input type="text" id="input-sub" value="NEXT GENERATION" oninput="updateText()">
        </div>

        <!-- メインタイトル微調整 -->
        <div class="control-group">
            <div class="control-label">メインフォントサイズ <span id="val-title-size" class="val">42px</span></div>
            <input type="range" id="range-title-size" min="12" max="300" value="42" oninput="render()">

            <div class="control-label" style="margin-top: 8px;">メイン上下位置 (Y) <span id="val-title-y" class="val">0px</span></div>
            <input type="range" id="range-title-y" min="-500" max="500" value="0" oninput="render()">

            <div class="control-label" style="margin-top: 8px;">メイン文字間隔 <span id="val-title-spacing" class="val">2px</span></div>
            <input type="range" id="range-title-spacing" min="-2" max="60" value="2" oninput="render()">
        </div>

        <!-- サブタイトル微調整 -->
        <div class="control-group">
            <div class="control-label">サブフォントサイズ <span id="val-sub-size" class="val">16px</span></div>
            <input type="range" id="range-sub-size" min="8" max="150" value="16" oninput="render()">

            <div class="control-label" style="margin-top: 8px;">サブ上下位置 (Y) <span id="val-sub-y" class="val">0px</span></div>
            <input type="range" id="range-sub-y" min="-500" max="500" value="0" oninput="render()">

            <div class="control-label" style="margin-top: 8px;">サブ文字間隔 <span id="val-sub-spacing" class="val">6px</span></div>
            <input type="range" id="range-sub-spacing" min="0" max="60" value="6" oninput="render()">
        </div>

        <!-- エフェクト・枠線調整 -->
        <div class="control-group">
            <div class="control-label">ネオン発光強度 (Glow) <span id="val-glow" class="val">20px</span></div>
            <input type="range" id="range-glow" min="0" max="100" value="20" oninput="render()">

            <div class="control-label" style="margin-top: 8px;">角丸 (Radius) <span id="val-radius" class="val">0%</span></div>
            <input type="range" id="range-radius" min="0" max="50" value="0" oninput="render()">
        </div>

        <!-- ガイド線表示 -->
        <div class="control-group">
            <button id="grid-toggle-btn" class="toggle-btn" onclick="toggleGrid()">中央ガイド線を表示</button>
        </div>
    </div>

    <script>
        let currentMode = 'icon';

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('mode-icon').classList.toggle('active', mode === 'icon');
            document.getElementById('mode-video').classList.toggle('active', mode === 'video');
            document.getElementById('mode-banner').classList.toggle('active', mode === 'banner');

            document.getElementById('presets-icon').style.display = mode === 'icon' ? 'grid' : 'none';
            document.getElementById('presets-video').style.display = mode === 'video' ? 'grid' : 'none';
            document.getElementById('presets-banner').style.display = mode === 'banner' ? 'grid' : 'none';

            if (mode === 'icon') {
                setCanvasSize(512, 512);
            } else if (mode === 'video') {
                setCanvasSize(1280, 720);
            } else {
                setCanvasSize(800, 250);
            }
        }

        function setCanvasSize(w, h) {
            document.getElementById('range-width').value = w;
            document.getElementById('range-height').value = h;
            
            // キャンバスサイズ変更時に各種初期設定値を自動調整
            autoAdjustTypography(w, h);
            applyCanvasSize(w, h);
        }

        function manualSizeChange() {
            const w = parseInt(document.getElementById('range-width').value);
            const h = parseInt(document.getElementById('range-height').value);
            
            autoAdjustTypography(w, h);
            applyCanvasSize(w, h);
        }

        // 解像度変更に合わせたフォントサイズやネオン光量の初期値・スライダー連動の自動計算
        function autoAdjustTypography(w, h) {
            const minDim = Math.min(w, h);
            const scale = minDim / 512; // 512pxを基準値とするスケール倍率

            const newTitleSize = Math.round(42 * scale);
            const newSubSize = Math.round(16 * scale);
            const newTitleSpacing = Math.max(1, Math.round(2 * scale));
            const newSubSpacing = Math.max(2, Math.round(6 * scale));
            const newGlow = Math.round(20 * scale);

            document.getElementById('range-title-size').value = newTitleSize;
            document.getElementById('range-sub-size').value = newSubSize;
            document.getElementById('range-title-spacing').value = newTitleSpacing;
            document.getElementById('range-sub-spacing').value = newSubSpacing;
            document.getElementById('range-glow').value = newGlow;
            
            document.getElementById('range-title-y').value = 0;
            document.getElementById('range-sub-y').value = 0;
        }

        function applyCanvasSize(w, h) {
            const canvas = document.getElementById('icon-canvas');
            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';
            document.getElementById('val-width').innerText = w + 'px';
            document.getElementById('val-height').innerText = h + 'px';

            render();
        }

        function updateText() {
            document.getElementById('title-logo').innerText = document.getElementById('input-title').value;
            document.getElementById('title-sub').innerText = document.getElementById('input-sub').value;
        }

        function toggleGrid() {
            const grid = document.getElementById('grid-overlay');
            const btn = document.getElementById('grid-toggle-btn');
            if (grid.style.display === 'block') {
                grid.style.display = 'none';
                btn.classList.remove('active');
            } else {
                grid.style.display = 'block';
                btn.classList.add('active');
            }
        }

        function render() {
            const titleSize = parseInt(document.getElementById('range-title-size').value);
            const titleY = parseInt(document.getElementById('range-title-y').value);
            const titleSpacing = parseInt(document.getElementById('range-title-spacing').value);

            const subSize = parseInt(document.getElementById('range-sub-size').value);
            const subY = parseInt(document.getElementById('range-sub-y').value);
            const subSpacing = parseInt(document.getElementById('range-sub-spacing').value);

            const glow = parseInt(document.getElementById('range-glow').value);
            const radius = parseInt(document.getElementById('range-radius').value);

            document.getElementById('val-title-size').innerText = titleSize + 'px';
            document.getElementById('val-title-y').innerText = titleY + 'px';
            document.getElementById('val-title-spacing').innerText = titleSpacing + 'px';

            document.getElementById('val-sub-size').innerText = subSize + 'px';
            document.getElementById('val-sub-y').innerText = subY + 'px';
            document.getElementById('val-sub-spacing').innerText = subSpacing + 'px';

            document.getElementById('val-glow').innerText = glow + 'px';
            document.getElementById('val-radius').innerText = radius + '%';

            // メインタイトル描画（文字間隔マージンをネガティブオフセットして完全中央配置）
            const titleLogo = document.getElementById('title-logo');
            titleLogo.style.fontSize = titleSize + 'px';
            titleLogo.style.transform = `translateY(${titleY}px)`;
            titleLogo.style.letterSpacing = titleSpacing + 'px';
            titleLogo.style.marginRight = `-${titleSpacing}px`;
            titleLogo.style.textShadow = `0 0 ${glow}px rgba(0, 240, 255, 0.5)`;

            // サブタイトル描画
            const titleSub = document.getElementById('title-sub');
            titleSub.style.fontSize = subSize + 'px';
            titleSub.style.transform = `translateY(${subY}px)`;
            titleSub.style.letterSpacing = subSpacing + 'px';
            titleSub.style.marginRight = `-${subSpacing}px`;

            const canvas = document.getElementById('icon-canvas');
            canvas.style.borderRadius = radius + '%';
        }

        // 画像生成・保存処理
        function downloadImage() {
            const grid = document.getElementById('grid-overlay');
            const originalGridState = grid.style.display;
            grid.style.display = 'none';

            const canvasArea = document.getElementById('icon-canvas');

            html2canvas(canvasArea, {
                backgroundColor: null,
                scale: 2,
                useCORS: true
            }).then(canvas => {
                grid.style.display = originalGridState;

                const link = document.createElement('a');
                let filename = 'app-icon.png';
                if (currentMode === 'video') filename = 'thumbnail-16-9.png';
                else if (currentMode === 'banner') filename = 'banner.png';
                
                link.download = filename;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        // 初期化実行
        render();
    </script>
</body>
</html>
