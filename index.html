<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PocketDev - Final Edition</title>
    <style>
        :root { --accent: #007acc; --bg: #1e1e1e; --panel: #252526; }
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: var(--bg); color: white; display: flex; flex-direction: column; }
        .toolbar { flex-shrink: 0; padding: 8px; background: #333; display: flex; flex-direction: column; gap: 4px; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .toolbar-row { display: flex; gap: 4px; width: 100%; }
        input, button { padding: 6px 8px; font-size: 12px; border-radius: 4px; border: 1px solid #555; background: #444; color: white; flex: 1 1 auto; }
        button { background: var(--accent); border: none; font-weight: bold; cursor: pointer; white-space: nowrap; }
        button:hover { opacity: 0.9; }
        .btn-run { background: #28a745; min-width: 90px; }
        .btn-clip { background: #555; }
        #editor-container { flex: 1; position: relative; display: flex; flex-direction: column; overflow: hidden; }
        #editor { flex: 1; width: 100%; border: none; padding: 10px; background: var(--panel); color: #d4d4d4; font-family: monospace; font-size: 14px; resize: none; box-sizing: border-box; outline: none; overflow-y: auto; }
        .footer-info { font-size: 10px; color: #888; padding: 4px 10px; background: #1a1a1a; }
    </style>
</head>
<body>

    <div class="toolbar">
        <div class="toolbar-row">
            <input type="text" id="findInput" placeholder="検索ワード">
            <button onclick="findNextText()">🔍 次へ</button>
            <button class="btn-clip" onclick="copyToClipboard()">コピー</button>
            <button class="btn-clip" onclick="pasteFromClipboard()">貼り付け</button>
        </div>
        <div class="toolbar-row">
            <input type="text" id="replaceInput" placeholder="置換後のワード">
            <button onclick="replaceText()">置換</button>
            <button onclick="replaceAllText()">すべて置換</button>
            <button class="btn-run" onclick="runCode()">▶ 実行</button>
        </div>
    </div>

    <div id="editor-container">
        <textarea id="editor" spellcheck="false" placeholder="ここにHTMLを貼り付けてください..."></textarea>
    </div>

    <div class="footer-info">
        ※ 実行時に「ポップアップの許可」を求められた場合は許可してください。
    </div>

    <script>
        const editor = document.getElementById('editor');
        let lastSearchTerm = "";
        let currentSearchIndex = -1;

        async function copyToClipboard() {
            try {
                await navigator.clipboard.writeText(editor.value);
                alert("コピーしました");
            } catch (err) { alert("失敗: " + err); }
        }

        async function pasteFromClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                if (confirm("内容を置き換えますか？")) { editor.value = text; }
            } catch (err) { alert("貼り付け失敗: " + err); }
        }

        function runCode() {
            let userCode = editor.value;
            if (!userCode.trim()) { alert("コードを入力してください"); return; }

            userCode = userCode.replace(/document\.addEventListener\(\s*["']DOMContentLoaded["']\s*,/g, '(function(');

            const fullHtml = `
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Preview</title>
</head>
<body>
    ${userCode}
</body>
</html>`;

            const blob = new Blob([fullHtml], { type: 'text/html' });
            const blobUrl = URL.createObjectURL(blob);
            
            const newWin = window.open(blobUrl, '_blank');
            if (!newWin) {
                alert("ポップアップがブロックされました。");
            }
        }

        // 次を検索してジャンプする機能
        function findNextText() {
            const txt = document.getElementById('findInput').value;
            if (!txt) return;

            // 検索ワードが変わった場合、または前回の検索からエディタのカーソル位置が大きく変わった場合は検索位置をリセット
            if (lastSearchTerm !== txt) {
                lastSearchTerm = txt;
                currentSearchIndex = editor.selectionStart;
            }

            let idx = editor.value.indexOf(txt, currentSearchIndex);

            // 見つからなかったら先頭からもう一度探す（ループ検索）
            if (idx === -1) {
                idx = editor.value.indexOf(txt, 0);
            }

            if (idx !== -1) {
                editor.focus();
                editor.setSelectionRange(idx, idx + txt.length);
                
                // スクロール位置の調整
                const lines = editor.value.substr(0, idx).split("\n").length;
                editor.scrollTop = (lines - 1) * 18;

                // 次回のために検索開始位置を更新
                currentSearchIndex = idx + txt.length;
            } else {
                alert("見つかりませんでした");
                currentSearchIndex = -1;
            }
        }

        // 選択中、または次の一致箇所を置換する機能
        function replaceText() {
            const findTxt = document.getElementById('findInput').value;
            const replaceTxt = document.getElementById('replaceInput').value;
            if (!findTxt) return;

            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            const selectedText = editor.value.substring(start, end);

            // 現在選択している文字列が検索ワードと一致していればそれを置換し、そうでなければ次を検索する
            if (selectedText === findTxt) {
                editor.value = editor.value.substring(0, start) + replaceTxt + editor.value.substring(end);
                editor.setSelectionRange(start, start + replaceTxt.length);
                currentSearchIndex = start + replaceTxt.length;
                findNextText(); // 置換後に自動で次へ進む
            } else {
                findNextText();
                // 次へ移動した後に一致していれば置換を実行
                const newStart = editor.selectionStart;
                const newEnd = editor.selectionEnd;
                if (editor.value.substring(newStart, newEnd) === findTxt) {
                    replaceText();
                }
            }
        }

        // すべて置換する機能
        function replaceAllText() {
            const findTxt = document.getElementById('findInput').value;
            const replaceTxt = document.getElementById('replaceInput').value;
            if (!findTxt) return;

            if (editor.value.includes(findTxt)) {
                // 正規表現でグローバル置換（特殊文字のエスケープ処理対応）
                const escapedFind = findTxt.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const regex = new RegExp(escapedFind, 'g');
                
                const matchCount = (editor.value.match(regex) || []).length;
                editor.value = editor.value.replace(regex, replaceTxt);
                alert(`${matchCount 箇所を置き換えました。}`);
            } else {
                alert("見つかりませんでした");
            }
        }
    </script>
</body>
</html>
